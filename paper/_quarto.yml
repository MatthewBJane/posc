project:
  type: manuscript

manuscript:
  article: index.qmd
  meca-bundle: false

notebook-links: false

format:
  html:
    toc: true
    number-sections: true
    shift-heading-level-by: -1
  pdf:
    documentclass: article
    number-sections: true
    keep-tex: false
    geometry:
      - margin=1in
    colorlinks: true
    shift-heading-level-by: -1
    tbl-cap-location: bottom

execute:
  warning: false
  message: false
  freeze: auto
  fig-dpi: 300
